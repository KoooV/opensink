include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - android/**
    - linux/**
    - web/**/*.g.dart
    - web/**
  errors:
    # Strict: treat common footguns as errors.
    avoid_print: error
    avoid_void_async: error
    cancel_subscriptions: error
    close_sinks: error
    comment_references: error
    empty_constructor_bodies: error
    prefer_const_constructors: error
    prefer_const_declarations: error
    prefer_final_fields: error
    prefer_relative_imports: error
    unawaited_futures: error
    unused_element: error
    unused_field: error
    unused_import: error
    void_checks: error

linter:
  rules:
    # Доменная логика: sealed classes / Result вместо исключений.
    avoid_classes_with_only_static_members: true
    avoid_init_to_null: true
    avoid_void_async: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    empty_constructor_bodies: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_relative_imports: true
    unawaited_futures: true
    unnecessary_lambdas: true
