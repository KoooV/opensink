name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap (pub get)
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Text hygiene
        run: bash tool/check_text_hygiene.sh

      - name: Assert no dart:io / dart:html in core_* packages
        run: |
          for pkg in packages/core_*; do
            if grep -rlE "import 'dart:(io|html)';" "$pkg/lib" 2>/dev/null; then
              echo "FORBIDDEN: $pkg imports dart:io or dart:html"
              exit 1
            fi
          done
          echo "OK: no core_* package imports dart:io/dart:html"

  core_crypto-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get core_crypto
        working-directory: packages/core_crypto
        run: dart pub get

      - name: Test core_crypto on VM
        working-directory: packages/core_crypto
        run: dart test -p vm --reporter json > /tmp/core_crypto_vm_report.json 2>&1 || true

      - name: Test core_crypto on Chrome
        working-directory: packages/core_crypto
        run: |
          # chrome доступен на ubuntu-latest runner; путь задаём явно, чтобы dart test
          # нашёл браузер без reliance на PATH. Если в целевом окружении статический
          # файраннер package:test отдаёт dart.js с text/plain (strict MIME blocking),
          # заменить этот шаг на запуск через tool/test_chrome.sh (собственный HTTP-сервер
          # с корректными MIME-типами: .js → application/javascript).
          export CHROME_EXECUTABLE=/usr/bin/google-chrome-stable
          dart test -p chrome --reporter json > /tmp/core_crypto_chrome_report.json 2>&1

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: core_crypto-test-reports
          path: /tmp/core_crypto_*_report.json

      - name: check_core_imports.sh
        run: bash tool/check_core_imports.sh

      - name: check_text_hygiene.sh
        run: bash tool/check_text_hygiene.sh

      - name: check_docs_drift.sh
        run: bash tool/check_docs_drift.sh

  core_signaling-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Test core_signaling in Chrome (dart2js)
        working-directory: packages/core_signaling
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome-stable
        run: dart test test/signaling_web_test.dart -p chrome -c dart2js

  core_sync-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Test SyncEngineImpl over DriftEventStore in Chrome (dart2js)
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome-stable
        run: bash tool/test_web_sync_chrome.sh

  core_peer-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Real WebRTC in headless Chrome
        working-directory: packages/core_peer
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome-stable
        run: |
          flutter test --platform chrome --dart-define=PEER_REAL_WEBRTC=true \
            test/integration/webrtc_loopback_test.dart

  storage-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Test full platform_web in Chrome (dart2js)
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome-stable
        run: bash tool/test_web_full_chrome.sh

  peer-native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Native WebRTC integration on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd apps/app
            flutter drive --driver=test_driver/integration_test.dart \
              --target=integration_test/peer_link_native_test.dart \
              -d emulator-5554 --dart-define=PEER_CHAOS=false

  builds:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor

      - name: Fetch and verify pinned web assets
        run: bash tool/fetch_web_assets.sh

      - name: Build Web (debug)
        working-directory: apps/app
        run: flutter build web --debug

      - name: Verify debug web resources
        working-directory: apps/app/build/web
        run: sha256sum --check "$GITHUB_WORKSPACE/tool/web_assets.sha256"

      - name: Build Web (release)
        working-directory: apps/app
        run: flutter build web --release

      - name: Verify release web resources
        working-directory: apps/app/build/web
        run: sha256sum --check "$GITHUB_WORKSPACE/tool/web_assets.sha256"

      - name: Build Linux
        run: |
          cd apps/app
          flutter build linux

      - name: Build APK
        run: |
          cd apps/app
          flutter build apk --debug
